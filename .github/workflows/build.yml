name: Build BeatWall v11.7 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK (v11.7)
        run: |
          if [ -f BeatWall/settings.gradle.kts ]; then
            cd BeatWall
          fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BeatWall-v11.7.apk

      - name: Upload BeatWall v11.7 Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatWall-v11.7-release-apk
          path: "**/app/build/outputs/apk/release/BeatWall-v11.7.apk"

      - name: Publish GitHub Release v11.7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.7
          name: BeatWall v11.7
          body: "BeatWall v11.7 — 20 polished 120 Hz LTPO worlds, true 9-line corner-to-corner 2-shade karaoke lyrics, zero-allocation rendering, and One UI Quick Settings tile."
          files: "**/app/build/outputs/apk/release/BeatWall-v11.7.apk"
          fail_on_unmatched_files: false
